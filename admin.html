<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vishal CSC Admin</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0B2545"><link rel="manifest" href="/admin.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/admin-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><script defer src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script><script defer src="/common.js"></script><script defer src="/admin.js"></script></head>
<body><header class="top"><div class="wrap"><a href="/" class="logo"><b>V</b><span>Vishal CSC Centre<small>PHAPHRANA • KARNAL</small></span></a><button id="out" class="btn out sm" hidden>Logout</button></div></header>
<main class="wrap" style="padding-top:18px;padding-bottom:60px">
<form id="lf" class="card stack" style="max-width:420px;margin:30px auto"><h1 style="font-size:1.6rem">Admin login</h1><div><label for="ae">Email</label><input id="ae" type="email" required autocomplete="username"></div><div><label for="ap">Password</label><input id="ap" type="password" required autocomplete="current-password"></div><p id="lerr" style="color:#B91C1C;font-size:.9rem"></p><button class="btn pri w" type="submit">Login</button></form>
<div id="panel" hidden>
<div class="tabs" id="tabs"><button class="btn out on" data-t="p-orders">Orders<span id="ncnt" class="cnt" hidden></span></button><button class="btn out" data-t="p-svc">Services</button><button class="btn out" data-t="p-news">Breaking news</button><button class="btn out" data-t="p-posts">Updates</button><button class="btn out" data-t="p-set">Settings</button></div>
<section id="p-orders" class="pane"><div id="fl" class="tabs" style="margin-top:0"></div><div id="ol" class="stack"></div></section>
<section id="p-svc" class="pane" hidden><div class="rowb" style="margin-bottom:14px"><h2 style="font-size:1.4rem">Services &amp; rates</h2><button id="addS" class="btn pri sm">+ Add service</button></div>
<div id="sfw" class="card" hidden style="margin-bottom:14px"><h3 id="sfh">Nayi service jodo</h3><form id="sf" style="margin-top:12px"><input type="hidden" id="sid"><div><label for="sn">Service name *</label><input id="sn" required maxlength="80"></div><div><label for="sd">Description</label><input id="sd" maxlength="200"></div><div><label for="sp">Rate (jaise ₹50 ya ₹100 se)</label><input id="sp" maxlength="30"></div><div><label for="si">Icon</label><select id="si"></select></div><div><label for="so2">Order number (chhota pehle)</label><input id="so2" type="number" min="0" max="999"></div><div><label><input id="sact" type="checkbox" checked style="width:auto"> Website par dikhao</label></div><div class="acts"><button class="btn pri" type="submit">Save</button><button class="btn out" type="button" id="cancelS">Cancel</button></div></form></div>
<button id="seed" class="btn dk w" hidden style="margin-bottom:14px">14 default services daalo</button><div id="sl" class="stack"></div></section>
<section id="p-news" class="pane" hidden><p class="mu" style="margin-bottom:10px">Live news website aur app ke upar scroll hoti hai.</p><div class="row"><input id="ni" placeholder="Breaking news likho" maxlength="250"><button id="addN" class="btn pri">Add</button></div><div id="nl" class="stack" style="margin-top:14px"></div></section>
<section id="p-posts" class="pane" hidden><div class="card stack"><input id="pt" placeholder="Headline" maxlength="140"><textarea id="pb" rows="3" placeholder="Details" maxlength="1800"></textarea><input id="pf" type="file" accept="image/*"><div class="acts"><button id="addP" class="btn pri">Publish</button><span id="pm" class="mu"></span></div></div><div id="pl" class="stack" style="margin-top:14px"></div></section>
<section id="p-set" class="pane" hidden><div class="card stack"><label><input id="so" type="checkbox" style="width:auto"> Dukaan abhi khuli hai</label><div><label for="sh">Timing (jaise 9AM – 8PM)</label><input id="sh" maxlength="40"></div><div class="acts"><button id="saveShop" class="btn pri">Save</button><span id="shm" class="mu"></span></div></div></section>
</div></main></body></html>
